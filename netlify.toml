[build]
  command = "bash ./netlify-build.sh"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# Backend API is hosted on Railway. If the Railway domain changes, update it below (twice).
# Use the bare host (no https://, no trailing slash).

[[redirects]]
  from = "/api/*"
  to = "https://website-production-73b04fd5.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://website-production-73b04fd5.up.railway.app/sitemap.xml"
  status = 200
  force = true

# Lets direct visits / refreshes of /shop/some-tea or /admin work (client-side routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
